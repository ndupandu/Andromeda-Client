      - name: Tulis settings.gradle yang benar dan tampilkan isi repo
        run: |
          rm -f settings.gradle.kts
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PalapaNetPortal"
          include ":app"
          EOF
          echo "=== isi root ==="; ls -la
          echo "=== isi app ==="; ls -la app || true
          echo "=== app/src/main ==="; ls -la app/src/main || true
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Opsional: tanda tangan rilis tetap (isi 4 secrets, lihat README)
      - name: Siapkan keystore (bila ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk PalapaNet-portal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PalapaNet-portal-apk
          path: PalapaNet-portal.apk
